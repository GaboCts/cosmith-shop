<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="60%" height="60%">
  <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>
      <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0369a1" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
  </defs>

  <rect width="800" height="600" fill="#131319" />

  <g fill="#ffffff" opacity="0.6">
      <circle cx="120" cy="100" r="2" />
      <circle cx="250" cy="80" r="1.5" />
      <circle cx="400" cy="140" r="2.5" />
      <circle cx="680" cy="90" r="2" />
      <circle cx="720" cy="220" r="1" />
      <circle cx="150" cy="300" r="1.5" />
      <circle cx="100" cy="450" r="2" />
      <circle cx="700" cy="480" r="2.5" />
      <circle cx="550" cy="520" r="1.5" />
      <circle cx="300" cy="500" r="2" />
  </g>

  <circle cx="650" cy="180" r="70" fill="url(#planetGrad)" opacity="0.8" />
  <path d="M 570 190 Q 650 230 730 170" stroke="#bae6fd" stroke-width="6" fill="none" opacity="0.4" />

  <text x="400" y="210" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="160"
      fill="#334155" text-anchor="middle" opacity="0.4" letter-spacing="10">404</text>

  <g transform="translate(400, 310)">
      <line x1="0" y1="-75" x2="0" y2="-110" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="-115" r="8" fill="#38bdf8" filter="url(#glow)" />

      <rect x="-55" y="-75" width="110" height="85" rx="20" fill="#cbd5e1" stroke="#64748b" stroke-width="4" />

      <rect x="-42" y="-60" width="84" height="55" rx="12" fill="#0f172a" />

      <g transform="translate(-20, -32)">
          <line x1="-8" y1="-8" x2="8" y2="8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
          <line x1="-8" y1="8" x2="8" y2="-8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      </g>
      <g transform="translate(20, -32)">
          <line x1="-8" y1="-8" x2="8" y2="8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
          <line x1="-8" y1="8" x2="8" y2="-8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      </g>

      <path d="M -12 -10 Q 0 -2 12 -10" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />

      <rect x="-68" y="-40" width="13" height="20" rx="4" fill="#64748b" />
      <rect x="55" y="-40" width="13" height="20" rx="4" fill="#64748b" />

      <rect x="-12" y="10" width="24" height="20" rx="4" fill="#64748b" />

      <rect x="-45" y="30" width="90" height="100" rx="20" fill="#cbd5e1" stroke="#64748b" stroke-width="4" />

      <circle cx="0" cy="65" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <circle cx="0" cy="65" r="6" fill="#38bdf8" filter="url(#glow)" />

      <path d="M -45 45 C -75 30 -70 0 -55 -10" stroke="#64748b" stroke-width="8" stroke-linecap="round"
          fill="none" />
      <circle cx="-55" cy="-10" r="7" fill="#cbd5e1" stroke="#64748b" stroke-width="3" />

      <path d="M 45 45 C 65 60 70 80 60 90" stroke="#64748b" stroke-width="8" stroke-linecap="round" fill="none" />
      <circle cx="60" cy="90" r="7" fill="#cbd5e1" stroke="#64748b" stroke-width="3" />

      <rect x="-50" y="130" width="100" height="22" rx="11" fill="#475569" stroke="#334155" stroke-width="3" />
      <line x1="-30" y1="130" x2="-30" y2="152" stroke="#64748b" stroke-width="3" />
      <line x1="0" y1="130" x2="0" y2="152" stroke="#64748b" stroke-width="3" />
      <line x1="30" y1="130" x2="30" y2="152" stroke="#64748b" stroke-width="3" />
  </g>

  <g fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" opacity="0.8">
      <text x="290" y="240" font-size="32" transform="rotate(-15 290 240)">?</text>
      <text x="530" y="220" font-size="40" transform="rotate(20 530 220)">?</text>
      <text x="490" y="140" font-size="24" transform="rotate(-10 490 140)">?</text>
  </g>

  <text x="400" y="520" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#f8fafc"
      text-anchor="middle">¡Ups! Page not found</text>
  <text x="400" y="555" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8"
      text-anchor="middle">The page you requested doesn't exist</text>
</svg>