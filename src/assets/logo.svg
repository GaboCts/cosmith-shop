            <stop offset="0%" stop-color="#00D2FF" />
            <stop offset="50%" stop-color="#7B2CBF" />
            <stop offset="100%" stop-color="#F72585" />
        </linearGradient>
        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
